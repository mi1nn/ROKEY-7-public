name: foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pure-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test Python contracts without ROS
        run: python -I scripts/run_tests.py
      - name: Validate the inert example
        env:
          PYTHONPATH: src/rescue_bringup
        run: python -m rescue_bringup config/deployment.example.json

  installed-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install setuptools==84.0.0 wheel==0.48.0
      - name: Build offline and test isolated installed packages
        run: python -I scripts/check_wheels.py
